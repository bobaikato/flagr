name: Ota lifecycle pressure

on:
  push:
    branches:
      - bobai/flagr-v11.18-lifecycle-pressure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-proof:
    name: Managed Compose lifecycle proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
      - uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184
        with:
          source: contract
      - name: Validate lifecycle contract
        run: ota validate . --json
      - name: Diagnose lifecycle lane
        run: ota doctor --workflow integration:lifecycle --json . > ota-lifecycle-doctor.json
      - name: Discover declared task surface
        run: ota tasks --use --json . > ota-lifecycle-tasks.json
      - name: Prove managed lifecycle transaction
        run: ota proof lifecycle --workflow integration:lifecycle --archive --json . > ota-lifecycle-proof.json
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ota-lifecycle-pressure
          path: |
            ota-lifecycle-doctor.json
            ota-lifecycle-tasks.json
            ota-lifecycle-proof.json
