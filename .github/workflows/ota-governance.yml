name: Ota governance

on:
  push:
    branches:
      - bobai/flagr-ota-pressure
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-native-linux:
    uses: ./.github/workflows/ota-verify-native-linux.yml
    with:
      ota_projection_identity: sha256:51da4f200efdcda0304c860ee9975e5243dc24b433e8e702313d329bf9a4262c
      ota_target_os: linux
      ota_runner: ubuntu-latest

  verify-native-macos:
    uses: ./.github/workflows/ota-verify-native-macos.yml
    with:
      ota_projection_identity: sha256:c4c1582107709662980bbd8b55727230fe18b93888c0784fa7e621a44ed5fe3f
      ota_target_os: macos
      ota_runner: macos-latest

  verify-native-windows:
    uses: ./.github/workflows/ota-verify-native-windows.yml
    with:
      ota_projection_identity: sha256:df0b05d6a72b68cc4af80272606468f7dba2ed28b92e1490dcd759e33c6efcd0
      ota_target_os: windows
      ota_runner: windows-latest

  verify-container-linux:
    uses: ./.github/workflows/ota-verify-container-linux.yml
    with:
      ota_projection_identity: sha256:e2a6bb89293ccc7268d3fa36e442447ff97a44f873a5d33b88d1168fc7fde307
      ota_target_os: linux
      ota_runner: ubuntu-latest

  # These runtime and Compose integration lanes are intentionally outside agent admission.
  # They remain human-owned CI proof instead of becoming a generated agent-execution projection.
  runtime-native:
    name: ${{ matrix.os }} bounded runtime proof
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
      - uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184
        with:
          source: contract
      - name: Prove bounded native runtime
        run: ota proof runtime --workflow local --mode native --archive --json

  runtime-container-and-integration:
    name: Ubuntu container runtime and integration proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
      - uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184
        with:
          source: contract
      - name: Diagnose container and integration readiness
        run: |
          ota doctor --container --json . > ota-container-doctor.json
          ota doctor --workflow integration --json . > ota-integration-doctor.json
      - name: Preview container and integration surfaces
        run: |
          ota run dev --container --dry-run --json .
          ota up --workflow integration --dry-run --json .
          ota run verify:integration --dry-run --json .
      - name: Prove bounded container runtime
        run: ota proof runtime --workflow local --mode container --archive --json
      - name: Start the documented integration topology
        run: ota up --workflow integration --stream .
      - name: Execute integration suite and benchmark
        run: ota run verify:integration --stream .
      - name: Archive integration receipt
        run: ota receipt --workflow integration --archive --json . > ota-integration-receipt.json
      - name: Tear down integration topology
        if: always()
        run: ota run integration:down --stream .
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ota-container-and-integration-diagnostics
          path: |
            ota-container-doctor.json
            ota-integration-doctor.json
            ota-integration-receipt.json

  contract-ci-drift:
    name: Contract-to-CI drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Fail on contract-to-CI workflow drift
        uses: ota-run/action@4fba25c6c0063af009d38e215d97ab1a925277c8
        with:
          command: doctor
          source: contract
          contract-path: ota.yaml
          fail-on-ci-drift: true
          comment-pr: false
          artifact-name: ota-contract-ci-drift
