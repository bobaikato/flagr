version: 1
project:
  name: flagr
  description: Go feature-flag service with a SQLite-backed local server and Docker Compose integration topology
  type: service

execution:
  default_context: host
  contexts:
    host:
      backend: native
    app:
      backend: container
      lifecycle: persistent
      container:
        image: golang:1.26-bookworm

toolchains:
  go:
    version: ">=1.26,<1.27"
    fulfillment:
      source: go
      mode: none

surfaces:
  api:
    kind: http
    label: Flagr API
    purpose: Local SQLite-backed Flagr API
    visibility: internal
    port: 18000
    path: /api/v1/health
    readiness:
      kind: http
      path: /api/v1/health
      interval: 2s
      timeout: 3s
      retries: 15

services:
  integration-sqlite:
    manager:
      kind: compose
      name: integration_tests
      file: integration_tests/docker-compose.yml
      service: flagr_with_sqlite
    endpoints:
      host:
        address: 127.0.0.1
        port: 18001
    readiness:
      kind: http
      from: host
      path: /api/v1/health
      success:
        status: [200]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  integration-mysql:
    manager:
      kind: compose
      name: integration_tests
      file: integration_tests/docker-compose.yml
      service: flagr_with_mysql
    endpoints:
      host:
        address: 127.0.0.1
        port: 18002
    readiness:
      kind: http
      from: host
      path: /api/v1/health
      success:
        status: [200]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  integration-mysql8:
    manager:
      kind: compose
      name: integration_tests
      file: integration_tests/docker-compose.yml
      service: flagr_with_mysql8
    endpoints:
      host:
        address: 127.0.0.1
        port: 18003
    readiness:
      kind: http
      from: host
      path: /api/v1/health
      success:
        status: [200]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  integration-postgres9:
    manager:
      kind: compose
      name: integration_tests
      file: integration_tests/docker-compose.yml
      service: flagr_with_postgres9
    endpoints:
      host:
        address: 127.0.0.1
        port: 18004
    readiness:
      kind: http
      from: host
      path: /api/v1/health
      success:
        status: [200]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  integration-postgres13:
    manager:
      kind: compose
      name: integration_tests
      file: integration_tests/docker-compose.yml
      service: flagr_with_postgres13
    endpoints:
      host:
        address: 127.0.0.1
        port: 18005
    readiness:
      kind: http
      from: host
      path: /api/v1/health
      success:
        status: [200]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  integration-legacy:
    manager:
      kind: compose
      name: integration_tests
      file: integration_tests/docker-compose.yml
      service: checkr_flagr_with_sqlite
    endpoints:
      host:
        address: 127.0.0.1
        port: 18006
    readiness:
      kind: http
      from: host
      path: /api/v1/health
      success:
        status: [200]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

tasks:
  setup:
    description: Hydrate the Go module graph required by the selected execution mode
    category: setup
    execution:
      default_mode: native
      modes:
        native:
          context: host
          prepare:
            kind: dependency_hydration
            medium: package_dependencies
            source:
              kind: go_modules
              cwd: .
        container:
          context: app
          prepare:
            kind: dependency_hydration
            medium: package_dependencies
            source:
              kind: go_modules
              cwd: .
    effects:
      network: true
      network_kind: dependency_hydration
    requirements:
      toolchains:
        - go
    safe_for_agent: true

  build:
    description: Build the Flagr server binary from the generated API and Go source
    category: build
    execution:
      default_mode: native
      modes:
        native:
          context: host
          env:
            CGO_ENABLED: "0"
          command:
            exe: go
            args:
              - build
              - -o
              - flagr
              - github.com/openflagr/flagr/cmd/flagr-server
        container:
          context: app
          env:
            CGO_ENABLED: "0"
          command:
            exe: go
            args:
              - build
              - -o
              - flagr
              - github.com/openflagr/flagr/cmd/flagr-server
    depends_on:
      - setup
    effects:
      writes:
        - flagr
    requirements:
      toolchains:
        - go
    safe_for_agent: true

  integration:image:
    description: Build the locally tagged image consumed by the six-node Compose integration topology
    category: build
    action:
      kind: build_container_image
      file: integration_tests/Dockerfile-Integration-Test
      context: .
      tag: flagr_integration_tests
    requirements:
      tools:
        docker: "*"
    effects:
      network: true
      network_kind: broad
      external_state:
        - docker
    notes: |
      This is the typed replacement for integration_tests/Makefile build-image. It intentionally
      remains outside agent-safe execution because the Docker build can acquire base and build-stage
      dependencies over the network.

  integration:down:
    description: Remove the documented Compose integration stack and its test volumes
    category: clean
    adapter_inputs:
      overlays:
        compose:
          cwd: integration_tests
          files:
            - docker-compose.yml
          project_name: integration_tests
    compose:
      kind: down
      remove_volumes: true
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - mysql
        - postgres

  integration:network:
    description: Ensure the external Docker network required by the integration Compose topology
    category: setup
    action:
      kind: ensure_container_network
      name: flagr_integration_tests
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker

  integration:up:
    description: Start the documented six-instance Compose integration topology
    category: setup
    adapter_inputs:
      overlays:
        compose:
          cwd: integration_tests
          files:
            - docker-compose.yml
          project_name: integration_tests
    compose:
      kind: up
      detach: true
    depends_on:
      - integration:down
      - integration:network
      - integration:image
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - mysql
        - postgres

  integration:test:
    description: Run the documented Go integration suite across all six Compose-backed Flagr instances
    category: test
    command:
      exe: go
      args:
        - test
        - -tags=integration
        - -v
        - -count=1
        - .
      cwd: integration_tests
    env:
      FLAGR_SERVER_URLS: localhost:18001,localhost:18002,localhost:18003,localhost:18004,localhost:18005,localhost:18006
    depends_on:
      - integration:up
    requires_services:
      - integration-sqlite
      - integration-mysql
      - integration-mysql8
      - integration-postgres9
      - integration-postgres13
      - integration-legacy
    requirements:
      toolchains:
        - go
      tools:
        docker: "*"
    effects:
      network: true
      network_kind: integration_test
      external_state:
        - docker
        - mysql
        - postgres

  integration:benchmark:
    description: Run the documented Go integration benchmark pass across all six Compose-backed Flagr instances
    category: test
    command:
      exe: go
      args:
        - test
        - -tags=integration
        - -bench=.
        - -benchmem
        - -count=1
        - -run=^$
        - .
      cwd: integration_tests
    env:
      FLAGR_SERVER_URLS: localhost:18001,localhost:18002,localhost:18003,localhost:18004,localhost:18005,localhost:18006
    depends_on:
      - integration:up
    requires_services:
      - integration-sqlite
      - integration-mysql
      - integration-mysql8
      - integration-postgres9
      - integration-postgres13
      - integration-legacy
    requirements:
      toolchains:
        - go
      tools:
        docker: "*"
    effects:
      network: true
      network_kind: integration_test
      external_state:
        - docker
        - mysql
        - postgres

  dev:
    description: Start the local SQLite-backed Flagr API and wait for its health endpoint
    category: dev
    execution:
      default_mode: native
      modes:
        native:
          context: host
          launch:
            kind: command
            exe: ./flagr
            args:
              - --host
              - 127.0.0.1
              - --port
              - "18000"
          runtime:
            kind: service
            surfaces:
              - api
        container:
          context: app
          launch:
            kind: command
            exe: ./flagr
            args:
              - --host
              - 0.0.0.0
              - --port
              - "18000"
          runtime:
            kind: service
            surfaces:
              api:
                bind:
                  address: 0.0.0.0
                  port:
                    mode: fixed
                    value: 18000
                project:
                  host:
                    address: 127.0.0.1
                    port:
                      mode: fixed
                      value: 18000
                    path: /api/v1/health
                    primary: true
    depends_on:
      - build
    requirements:
      toolchains:
        - go

  test:
    description: Run the deterministic Go package test lane
    category: test
    execution:
      default_mode: native
      modes:
        native:
          context: host
          command:
            exe: go
            args:
              - test
              - ./pkg/...
        container:
          context: app
          command:
            exe: go
            args:
              - test
              - ./pkg/...
    depends_on:
      - setup
    requirements:
      toolchains:
        - go
    safe_for_agent: true

  verify:
    description: Run the contract-owned deterministic verification lane
    category: test
    aggregate:
      tasks:
        - test
    safe_for_agent: true

  verify:integration:
    description: Run the documented six-instance Docker Compose integration suite and benchmark verification lane
    category: test
    aggregate:
      tasks:
        - integration:test
        - integration:benchmark

workflows:
  default: local
  local:
    intent: local_development
    description: Build and run the local SQLite-backed API
    run:
      task: dev
  verify:
    intent: verification
    description: Run deterministic Go package verification
    run:
      task: verify
  integration:
    intent: verification
    description: Build the integration image, start the six-instance Compose topology, prove all endpoint readiness, and run the multi-instance Go integration suite and benchmark pass
    setup:
      task: integration:up
    run:
      task: verify:integration

agent:
  posture: readiness_strict
  entrypoint: setup
  default_task: verify
  safe_tasks:
    - setup
    - build
    - test
    - verify
  writable_paths:
    - flagr
  protected_paths:
    - swagger_gen
  verify_after_changes:
    - verify
  bootstrap:
    ota:
      source:
        kind: branch
        branch: 1.6.24-implementation

metadata:
  ota:
    minimum_version: "1.6.24"
